version: 2

project_name: cobalt

before:
  hooks:
    - go mod tidy

builds:
  - id: cobalt
    main: ./cmd/cobalt
    binary: cobalt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: cobalt
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

dockers_v2:
  - images:
      - "ghcr.io/heyblueteam/cobalt"
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    labels:
      "org.opencontainers.image.description": "Deployment glue for Docker Swarm + Caddy"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"

homebrew_casks:
  - name: cobalt
    repository:
      owner: heyblueteam
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://cobalt.devel
    description: "Deployment glue for Docker Swarm + Caddy"
    license: MIT
    url:
      verified: "github.com/heyblueteam/cobalt"
    binaries:
      - "cobalt"

scoops:
  - name: cobalt
    repository:
      owner: heyblueteam
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      branch: main
    directory: bucket
    homepage: https://cobalt.devel
    description: "Deployment glue for Docker Swarm + Caddy"
    license: MIT

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]

release:
  github:
    owner: heyblueteam
    name: cobalt