# Cobalt deployment stack.
#
# Services:
#   rqlite  - SQLite-over-HTTP distributed database (single node for v1)
#   caddy   - TLS terminator + reverse proxy, admin API on unix socket
#   cobalt  - Daemon: HTTP API, deploy orchestrator, background workers
#
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f cobalt
#
# The cobalt service expects:
#   - Docker socket mounted at /var/run/docker.sock (to shell out to host docker)
#   - rqlite available at rqlite:4001
#   - Caddy admin socket shared at /cobalt/caddy-socket/caddy.sock
#
# Network topology:
#   - cobalt-main (attachable overlay) created by the daemon on first deploy
#   - Services communicate over the compose-defined bridge network
#
# Volumes:
#   cobalt-data      - BuildKit cache, deploy logs, workspaces
#   caddy-data       - Caddy's auto-managed TLS and acme certs
#   caddy-config     - Caddy's persistent config
#
# Ports:
#   80   - HTTP (redirects to 443 if standalone TLS enabled)
#   443  - HTTPS (standalone TLS; omit caddy-ssl service below if behind a tunnel)
#
# Environment variables for cobalt:
#   COBALT_PUBLIC_HOST  - Daemon's public hostname (used in GitHub App manifest URLs)
#   COBALT_DATA_DIR      - Override data directory (default /cobalt/data)
#
version: "3.9"

x-cobalt-base: &cobalt-base
  image: ghcr.io/heyblueteam/cobalt:${COBALT_VERSION:-latest}
  depends_on:
    rqlite:
      condition: service_healthy
  volumes:
    - cobalt-data:/cobalt/data
    - caddy-socket:/cobalt/caddy-socket
    - /var/run/docker.sock:/var/run/docker.sock
    # Mount the host's compose directory so `cobalt upgrade` can shell
    # out to `docker compose -f /cobalt/compose/docker-compose.yml
    # up -d cobalt` from inside a transient helper container that the
    # daemon spawns. Read-only on the daemon side (it never writes
    # here); the helper mounts the same host path read-write so it
    # can update .env to pin the new COBALT_VERSION.
    # COBALT_COMPOSE_DIR (host path) defaults to ./ — i.e. the dir the
    # operator ran `docker compose up` in.
    - ${COBALT_COMPOSE_DIR:-./}:/cobalt/compose:ro
  environment:
    COBALT_DATA_DIR: /cobalt/data
    COBALT_VERSION: ${COBALT_VERSION:-latest}
    # Host-side absolute path to the compose dir, so the daemon knows
    # what to pass as the helper container's bind-mount source. Without
    # this the helper would see the daemon's view of the directory but
    # `docker run --volume <src>:<dst>` resolves <src> on the host, not
    # in the daemon container.
    COBALT_COMPOSE_HOST_DIR: ${COBALT_COMPOSE_DIR:-./}
  restart: unless-stopped
  command: >
    server
    --addr 0.0.0.0:8080
    --rqlite-url http://rqlite:4001
    --data-dir /cobalt/data
    --caddy-socket /cobalt/caddy-socket/caddy.sock
    ${COBALT_PUBLIC_HOST:+"--public-host"}${COBALT_PUBLIC_HOST:+"$COBALT_PUBLIC_HOST"}

services:
  # rqlite is the persistence layer. Single-node for v1.
  # In production (v2+), you'd run a 3-node rqlite cluster for HA.
  rqlite:
    image: rqlite/rqlite:${RQLITE_VERSION:-latest}
    environment:
      HTTP_ADDR: "0.0.0.0:4001"
      HTTP_ADV_ADDR: "rqlite:4001"
    volumes:
      - rqlite-data:/rqlite/file
    healthcheck:
      test: ["CMD", "rqlite", "nodes"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Caddy handles TLS termination and routes traffic to cobalt.
  # Admin API runs over a unix socket shared with the cobalt container.
  caddy-ssl:
    image: caddy:${CADDY_VERSION:-2.7.6}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-socket:/cobalt/caddy-socket
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
      - "443:443"
    entrypoint: []
    command: >
      caddy run
      --config /etc/caddy/Caddyfile
      --adapter caddyfile
    restart: unless-stopped
    depends_on:
      - rqlite

  # The cobalt daemon. Handles HTTP API, deploy orchestration, workers.
  # Shares the Caddy unix socket for admin API communication.
  cobalt:
    <<: *cobalt-base
    labels:
      - "cobalt.daemon=true"

networks:
  default:
    driver: bridge

volumes:
  cobalt-data:
  rqlite-data:
  caddy-data:
  caddy-config:
  caddy-socket: