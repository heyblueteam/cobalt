# Cobalt deployment stack — deployed by `cobalt init` via
# `docker stack deploy -c docker-compose.yml cobalt`.
#
# Variables (COBALT_IMAGE, COBALT_PUBLIC_HOST, COBALT_DATA_DIR) are
# substituted from the calling shell environment; cobalt init sources
# /opt/cobalt/.env before invoking stack deploy, since stack deploy —
# unlike compose up — doesn't auto-load .env files.
#
# Stack-deploy specifics: services use deploy.* blocks for restart
# policy and replication; depends_on is preserved for the (rare)
# `docker compose up` workflow but isn't honored by swarm. Bind-mount
# paths are absolute because relative paths aren't reliably resolved
# in stack mode.

services:
  rqlite:
    image: rqlite/rqlite:8.43.4
    # Stable container hostname — rqlite stamps it into the raft
    # state on first boot, so a `docker service update` (e.g. to
    # change args or bump the image tag) that gives the new container
    # a different docker-assigned hostname leaves raft unable to
    # identify itself and the cluster wedged. Pin the hostname so
    # in-place updates work.
    hostname: rqlite
    # -fk turns on SQLite foreign-key enforcement so every
    # `ON DELETE CASCADE` in our schema actually fires. Without this
    # flag, deleting a project leaks its env_vars, domains,
    # deployments and command_runs rows. PRAGMA at runtime would not
    # survive rqlite's WAL replay, so the startup flag is the
    # documented fix.
    command: ["-fk=true"]
    volumes:
      - rqlite-data:/rqlite/file
    healthcheck:
      test: ["CMD", "rqlite", "-H", "localhost", "-p", "4001", ".ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      # Pin to the manager so the named volume's data persists across
      # restarts. Multi-manager swarms would need an external volume
      # driver (NFS, Longhorn, etc.) to lift this constraint.
      placement:
        constraints:
          - node.role == manager

  caddy:
    image: caddy:2.7.6
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-socket:/cobalt/caddy-socket
      - /opt/cobalt/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Use host-mode so client IPs reach Caddy directly (auto-HTTPS
      # HTTP-01 challenge needs the inbound IP, and access logs are
      # less useful behind the swarm routing mesh).
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    environment:
      COBALT_PUBLIC_HOST: ${COBALT_PUBLIC_HOST}
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
    depends_on:
      - rqlite
    # Caddy joins cobalt-main (an external attachable overlay
    # pre-created by `cobalt init`) so it can resolve swarm service
    # hostnames (e.g. e2e-6-web) for reverse_proxy upstreams.
    networks:
      - default
      - cobalt-main

  cobalt:
    image: ${COBALT_IMAGE}
    # depends_on is preserved for the local-dev `docker compose up`
    # workflow — `docker stack deploy` ignores it. The daemon's
    # rqlite client retries on connection refused, so swarm not
    # honoring depends_on isn't a correctness issue.
    depends_on:
      - rqlite
    volumes:
      - cobalt-data:${COBALT_DATA_DIR}
      - caddy-socket:/cobalt/caddy-socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      COBALT_DATA_DIR: ${COBALT_DATA_DIR}
    secrets:
      # Mounted as tmpfs at /run/secrets/cobalt_encryption_key. The
      # bytes live in the swarm Raft log (Docker-encrypted at rest)
      # and never touch a disk-backed FS inside the container.
      - cobalt_encryption_key
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      labels:
        - "cobalt.daemon=true"
    command: >
      server
      --addr 0.0.0.0:8080
      --rqlite-url http://rqlite:4001
      --data-dir ${COBALT_DATA_DIR}
      --caddy-socket /cobalt/caddy-socket/caddy.sock
      --public-host ${COBALT_PUBLIC_HOST}

networks:
  default:
    driver: overlay
  cobalt-main:
    external: true
    name: cobalt-main

volumes:
  cobalt-data:
  rqlite-data:
  caddy-data:
  caddy-config:
  caddy-socket:

secrets:
  cobalt_encryption_key:
    external: true
